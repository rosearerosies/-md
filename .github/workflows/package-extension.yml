name: Package extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create extension package
        run: |
          zip -r page-video-to-markdown-${GITHUB_REF_NAME}.zip \
            manifest.json src
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-video-to-markdown-${{ github.ref_name }}
          path: page-video-to-markdown-${{ github.ref_name }}.zip
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: page-video-to-markdown-${{ github.ref_name }}.zip
