<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="options.css">
    <title>后台管理设置</title>
  </head>
  <body>
    <main>
      <div class="page-shell">
        <header class="page-header">
          <div class="brand-mark">M</div>
          <div class="title-block">
            <div class="title-line">
              <h1>网页与视频转 Markdown 设置</h1>
              <span class="local-badge"><span></span>已连接</span>
            </div>
            <p>将网页内容快速保存为干净 Markdown，并在本地管理 API 和导出位置</p>
          </div>
        </header>

        <div class="settings-content">
          <section class="setting-card">
            <div class="section-heading">
              <div>
                <h2>保存位置</h2>
                <p>配置 Markdown 和一图速览的导出方式与保存目录。</p>
              </div>
            </div>
            <label>保存方式
              <select id="saveMode">
                <option value="folder">本地指定文件夹</option>
                <option value="default">浏览器默认下载目录</option>
                <option value="ask">每次导出时询问</option>
                <option value="subdirectory">默认目录下的子目录</option>
              </select>
            </label>
            <div id="folderControls" class="folder-controls">
              <div>
                <strong>当前文件夹</strong>
                <p id="folderName">尚未选择文件夹</p>
              </div>
              <button id="chooseFolder" class="secondary" type="button">选择文件夹</button>
            </div>
            <label id="subdirectoryControl">子目录
              <input id="saveSubdirectory" type="text" placeholder="markdown-exports">
            </label>
          </section>

          <section class="setting-card">
            <div class="section-heading">
              <div>
                <h2>API 管理</h2>
                <p>仅在生成摘要、测试连接或获取模型时使用。</p>
              </div>
              <button id="addApi" class="secondary" type="button">＋ 添加 API</button>
            </div>
            <div id="profiles"></div>
          </section>

          <section class="privacy-card">
            <strong>隐私说明</strong>
            <p>插件不会自动上传页面内容。只有你主动测试 API、获取模型或生成摘要时才会发起请求。</p>
          </section>

          <footer class="actions">
            <div>
              <button id="save" type="button">保存所有设置</button>
              <button id="clear" class="secondary" type="button">清除本地配置</button>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
          </footer>
        </div>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
